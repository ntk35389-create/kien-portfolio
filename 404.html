<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang đang được hoàn thiện — Nguyễn Trung Kiên</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800&family=Be+Vietnam+Pro:wght@300;500&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#150A0F;--ink:#FBF2F4;--muted:#9C8B92;--accent:#FF6B81;--line:rgba(251,242,244,.10);--display:'Unbounded',sans-serif;--body:'Be Vietnam Pro',sans-serif;--mono:'Space Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 80% 0%,rgba(255,107,129,.16),transparent 55%),var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 5vw;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.logo{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:0;color:var(--ink);text-transform:none}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 5vw 8vh}
.code{font-family:var(--display);font-weight:800;font-size:clamp(96px,24vw,320px);line-height:.85;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.code span{color:var(--accent);-webkit-text-stroke:0}
h1{margin-top:4vh;font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,40px);line-height:1.2;max-width:18ch}
p{margin-top:16px;max-width:46ch;font-size:clamp(15px,1.2vw,18px);line-height:1.7;color:var(--muted)}
.actions{margin-top:40px;display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border-radius:999px;font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);transition:background .3s,color .3s,border-color .3s}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn:hover{border-color:var(--accent)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
footer{padding:24px 5vw;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<header><a class="logo" href="/">KN®</a><span>Portfolio 2026 — 2027</span></header>
<main>
  <div class="code" aria-hidden="true">4<span>0</span>4</div>
  <h1>Trang này đang được hoàn thiện.</h1>
  <p>Case study bạn tìm chưa được đăng hoặc đường dẫn không tồn tại. Hãy quay lại trang chủ để xem các dự án khác.</p>
  <div class="actions">
    <a class="btn primary" href="/">← Về trang chủ</a>
    <a class="btn" href="https://www.facebook.com/ntrugkien1510/" target="_blank" rel="noopener">Liên hệ</a>
  </div>
</main>
<footer><span>Nguyễn Trung Kiên — UI/UX Designer</span><span>Hà Nội, Việt Nam</span></footer>
</body>
</html>
